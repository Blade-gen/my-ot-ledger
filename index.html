<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="按标准下班时间统计每月平均加班时长的个人看板" />
    <title>加班时长</title>
    <link rel="icon" href="data:," />
    <!--
      加载遮罩的样式**唯一定义处**（Vue 版遮罩也用这几个 class，见 LoadingOverlay.vue）。

      为什么不放在 app.css：
        1. 开发模式下 app.css 是由 JS 注入的，等它到达时兜底遮罩已经绘制过了 ——
           表现为「无样式文字 → 突然跳变成卡片」的突变。
        2. 更隐蔽的是 box-sizing：app.css 里有全局的 `* { box-sizing: border-box }`，
           在它生效之前，内联样式按默认的 content-box 计算，
           于是卡片被撑成 216px、spinner 变成 30px；CSS 到达后才缩回 168px / 26px。
           两处样式重复定义必然漂移，所以这里只留一份。

      ⚠️ 颜色写**字面量**而不是 var(--bg) 之类：那些 CSS 变量定义在 app.css 的 :root 里，
         在本样式块生效的时点还不存在。改色时请同步 app.css 的变量取值。
      ⚠️ 不要把这些规则再抄回 app.css（会重新引入漂移）。
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f2f3f5;
      }

      /* 兜底遮罩层级要高于 Vue 遮罩（40），交接时才不会闪 */
      #boot-loading {
        z-index: 50;
      }

      .loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f2f3f5;
        /* 显式声明：不依赖 app.css 的全局 `* { box-sizing }` */
        box-sizing: border-box;
      }

      .loading *,
      .loading *::before,
      .loading *::after {
        box-sizing: border-box;
      }

      /* display:flex 会盖掉 UA 的 [hidden]{display:none}，显式声明一次，
         以便用 `loading.hidden = true` 也能隐藏（Vue 侧用的是 v-if） */
      .loading[hidden] {
        display: none;
      }

      /* 遮罩需要第一帧就完全不透明，因此刻意不加淡入动画 */
      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-width: 168px;
        padding: 22px 24px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(16, 16, 24, 0.04), 0 8px 20px rgba(16, 16, 24, 0.035);
      }

      .loading-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: #6e6e76;
        text-align: center;
      }

      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2.5px solid #e9e9ec;
        border-top-color: #f4575a;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 多月份加载时的细进度条 */
      .loading-bar {
        width: 140px;
        height: 3px;
        border-radius: 2px;
        background: #e9e9ec;
        overflow: hidden;
      }

      .loading-bar-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 2px;
        background: #f4575a;
        transition: width 0.2s ease;
      }

      /* 减弱动效偏好：保留提示，但转慢一些 */
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!--
      首屏兜底 loading。

      为什么必须有：脚本是 module（延迟执行），CSS 在开发模式下也是由 JS 注入的。
      若只靠 Vue 渲染遮罩，在 HTML/JS/CSS 到达之前页面是空白的 —— 即高度坍缩。

      这里用与 LoadingOverlay.vue **完全相同的 class**，样式来自上面的 <style>，
      因此从第一帧起就与 Vue 版遮罩逐像素一致，交接时看不出任何变化。
    -->
    <div id="boot-loading" class="loading" role="status" aria-live="polite">
      <div class="loading-box">
        <span class="spinner" aria-hidden="true"></span>
        <p class="loading-text">正在加载数据…</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
