<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="按标准下班时间统计每月平均加班时长的个人看板" />
    <title>加班时长看板</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="topbar-side"></div>
        <div class="topbar-main">
          <div class="title-row">
            <h1 class="app-title">加班时长</h1>
            <button
              type="button"
              class="icon-btn icon-btn--title"
              id="btnRules"
              aria-label="统计规则"
              aria-haspopup="dialog"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="M10 3.2a6.8 6.8 0 1 1 0 13.6 6.8 6.8 0 0 1 0-13.6zm0 1.6a5.2 5.2 0 1 0 0 10.4 5.2 5.2 0 0 0 0-10.4zm0 1.8a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7zm.7 2.9v4.1h-1.4V9.5z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
          <button type="button" class="month-picker" id="monthPicker" aria-haspopup="dialog">
            <span id="monthLabel">加载中…</span>
            <svg class="caret" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2.2 4.4 6 8.2l3.8-3.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="topbar-side right">
          <button type="button" class="icon-btn" id="btnSettings" aria-label="设置" aria-haspopup="dialog">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M10 6.2a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zm0 5.2a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zm0 5.2a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="layout">
        <div class="col col-left">
          <div class="segmented" id="segmented" role="tablist" aria-label="统计范围">
            <button type="button" class="seg is-active" data-view="month" role="tab" aria-selected="true">
              月
            </button>
            <button type="button" class="seg" data-view="all" role="tab" aria-selected="false">全部</button>
          </div>

          <section class="card panel-card">
            <div class="hero">
              <div class="hero-value">
                <span id="heroValue">0</span>
                <span class="hero-unit" id="heroUnit">小时/天</span>
              </div>
              <p class="hero-caption" id="heroCaption"></p>
            </div>

            <div class="chart-block">
              <p class="chart-title" id="chartTitle"></p>
              <div class="chart" id="chart"></div>
              <div class="legend">
                <span class="lg"><i class="sw sw--bar"></i>加班时长</span>
                <span class="lg"><i class="sw sw--avg"></i>平均值</span>
                <span class="lg"><i class="sw sw--dot"></i>忘打卡</span>
                <span class="lg"><i class="sw sw--ex"></i>无数据</span>
              </div>
            </div>
          </section>
        </div>

        <div class="col col-right">
          <section class="card">
            <div class="card-head">
              <span class="card-icon">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4 13.6h2.6V16H4zm4.7-4.2h2.6V16H8.7zm4.7-5.4H16V16h-2.6z" fill="currentColor" />
                </svg>
              </span>
              <h2 id="overviewTitle">本月概览</h2>
            </div>
            <div class="stat-grid" id="statGrid"></div>
            <p class="card-note" id="cardNote"></p>
          </section>

          <section class="card">
            <div class="card-head">
              <span class="card-icon">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M6.4 3.2h1.6v1.6h4V3.2h1.6v1.6h1.6v11.2H4.8V4.8h1.6zm7.2 4.8H6.4v6.4h7.2z" fill="currentColor" />
                </svg>
              </span>
              <h2 id="detailTitle">每日明细</h2>
              <span class="card-head-extra" id="detailCount"></span>
            </div>
            <div class="table-wrap">
              <table class="detail-table">
                <thead>
                  <tr id="detailHead"></tr>
                </thead>
                <tbody id="detailBody"></tbody>
              </table>
            </div>
            <div class="excluded-block" id="excludedBlock" hidden>
              <h3>已排除的日期</h3>
              <div class="chips" id="excludedChips"></div>
            </div>
          </section>

          <p class="footnote" id="footnote"></p>
        </div>
      </div>
    </div>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
